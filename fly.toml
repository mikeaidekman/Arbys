# Arbys — one machine, and deliberately only one.
#
# This app streams both venues over persistent WebSockets and auto-trades what
# it detects. Two instances would each hold their own quote book, each publish
# opportunities, and each submit tickets against the same venue credentials —
# two ledgers agreeing with each other about nothing. Every setting below that
# looks like a missed optimisation is holding that line.
#
# Fly's Launch UI defaults to two machines and 256MB; both are wrong here and
# both are corrected in this file. After changing it, confirm with
# `machines list` (the Fly admin workflow) that exactly one exists.

app = "arbys-dekman"
primary_region = "ewr"

[build]

# Runs in a temporary machine with the app's secrets, BEFORE the new version
# goes live — and aborts the deploy if it fails, so a broken migration never
# reaches a running app. This is also why the production database never needs
# a connection string on anyone's laptop: the only place it exists is Fly's
# secret store.
#
# `alembic upgrade head` is idempotent, so it is safe on every deploy and not
# only the first. Note bootstrap() also calls create_all(), which is a no-op
# against an already-migrated schema; the migration chain stays the source of
# truth for prod and the Postgres CI workflow is what proves the two agree.
[deploy]
  release_command = "alembic upgrade head"

# Feature flags live here rather than in the secret store precisely because
# they should be visible in review: these three lines are the difference
# between an idle web app and a bot trading around the clock.
#
# AUTO_TRADE went to 1 on 2026-08-31, once Cloudflare Access was verified to be
# *enforcing* and not merely fronting: on the bare `arbys-dekman.fly.dev`
# hostname every endpoint now returns 403 — `POST /quotes` and the websocket
# included — while `/health` stays open by design. The dangerous combination
# was a publicly-writable app that also trades, and `POST /quotes` can
# manufacture an arbitrage out of nothing; either half alone is minor.
#
# This is the paper broker filling against live venue odds, not real orders —
# no ExecutionAdapter places anything on either venue today. What is now at
# risk is the honesty of the ledger, not money.
#
# Two caps still bind and neither is a substitute for the other:
# ARBYS_MAX_TICKET_STAKE (200) at detection, ARBYS_MAX_OUTCOME_QTY (500) at
# execution. Both keep their defaults.
[env]
  ARBYS_ENABLE_INGEST = "1"
  ARBYS_ENABLE_DISCOVERY = "1"
  ARBYS_ENABLE_AUTO_TRADE = "1"

[http_service]
  internal_port = 8000
  force_https = true

  # Scale-to-zero has nothing to restart the venue websockets from: a stopped
  # machine is a stopped feed, and the first request would find an empty quote
  # book rather than a live one.
  auto_stop_machines = false
  auto_start_machines = false

  # One. Not "at least one" as a floor under a larger number — one.
  min_machines_running = 1

# A dedicated core, not a shared one. This is a 24/7 feed processor: ~127
# frames/s parsed and upserted, per-tick arb evaluation across ~864 groups, and
# a discovery pass every 10 minutes. Fly throttles sustained shared-CPU usage,
# and `shared-cpu-1x` was throttled hard enough to break the app's core
# invariant rather than merely slow it down.
#
# Measured on shared-cpu-1x: `/monitored` took 23.9s for the same 864 groups
# that take 0.43s locally -- ~50x, far past what a slower core explains. Event
# loop lag ran p50 2.3s / p95 5.6s / max 9.2s. That matters twice over: both
# venue websockets use ping_timeout=20 and were dropping every ~60s, and
# ARBYS_POLYMARKET_US_PRIORITY_DARK_AFTER_S is *6 seconds*, so the stall alone
# marked live in-play markets dark, escalating into shard rebuilds that each
# replay hours-old cached books. The reconnect storm was self-inflicted by
# starvation.
#
# Sub-second quote freshness is the whole safety story here (see the
# only-tradeable invariants in CLAUDE.md), so it cannot be bought back with a
# throttled core. Check `loop_lag` in /health after changing this.
[[vm]]
  size = "performance-1x"
  # The local process sits at ~148MB after 24h with 560 groups and six
  # WebSocket shards, before Python's own overhead. 2GB is what performance-1x
  # carries by default and leaves room for a discovery pass on top.
  memory = "2gb"

# Not for storage — the ledger lives in Postgres and this app writes nothing to
# disk. A Fly volume attaches to one machine at a time, so its presence makes
# accidentally running two awkward. Belt and braces: the real guarantee is the
# Postgres advisory lock in the app's bootstrap.
#
# The volume must exist and be in `primary_region` before a deploy referencing
# it will succeed. Create it with the Fly admin workflow:
#   volumes create arbys_data --size 1 --region ewr --yes
[[mounts]]
  source = "arbys_data"
  destination = "/data"

# Room for the shutdown drain to finish in-flight tickets rather than being
# cut off mid-unwind. Must stay comfortably above the app's own drain bound.
kill_timeout = 60
