services:
  postgres:
    image: postgres:16-alpine
    container_name: arbys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbys
      POSTGRES_PASSWORD: arbys
      POSTGRES_DB: arbys
    ports:
      - "5432:5432"
    volumes:
      - arbys-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbys -d arbys"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arbys-pgdata:
