<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42" height="42">
  <!-- The Arbys mark. Geometry is the lockup's 42px square verbatim: bars
       16x6 at r1.5, 6px apart, inset 8px, offset to opposite edges. -->
  <rect width="42" height="42" rx="7" fill="#17376f"/>
  <rect x="8" y="12" width="16" height="6" rx="1.5" fill="#ffffff"/>
  <rect x="18" y="24" width="16" height="6" rx="1.5" fill="#e0574e"/>
</svg>
